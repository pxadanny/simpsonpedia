<div class="fixed inset-x-0 top-0 z-50 flex h-[116px] w-full flex-col items-center justify-center gap-2 border-b-2 border-amber-300 bg-[#FFFFF0] px-4 py-3 shadow-sm md:h-[84px] md:flex-row md:justify-between md:gap-4 md:px-6">
  <a routerLink="/characters" class="logo simpsons-title whitespace-nowrap text-3xl font-bold text-amber-300 sm:text-4xl md:text-5xl" aria-label="Simpsonpedia home">
    Simpsonpedia
  </a>

  <form class="relative w-full md:w-2/5 lg:w-1/3" role="search" (ngSubmit)="submitSearch()">
    <label for="global-search-input" class="sr-only">Search characters, episodes and locations</label>
    <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-amber-600" aria-hidden="true"></i>
    <input id="global-search-input" type="search" name="query" [(ngModel)]="query"
      placeholder="Search Springfield..."
      autocomplete="off" minlength="2"
      class="w-full rounded-full border border-amber-300 bg-amber-100 py-2.5 pl-11 pr-20 text-sm text-slate-900 placeholder:text-slate-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-500" />
    <button type="submit" [disabled]="query.trim().length < 2" aria-label="Search"
      class="absolute right-1 top-1/2 -translate-y-1/2 rounded-full bg-yellow-400 px-4 py-2 text-xs font-extrabold text-slate-900 transition hover:bg-yellow-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 disabled:cursor-not-allowed disabled:opacity-50">
      Go
    </button>
  </form>

  <button type="button"
    (click)="discoverRandom()"
    [disabled]="randomLoading"
    [attr.aria-busy]="randomLoading"
    [attr.aria-label]="randomLoading ? 'Finding a random discovery' : 'Discover a random character, episode or location'"
    title="Discover a random character, episode or location"
    class="fixed bottom-25 right-5 flex h-14 w-14 items-center justify-center gap-2 rounded-full bg-yellow-400 text-xl font-semibold text-slate-900 shadow-lg transition hover:bg-yellow-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700 disabled:cursor-wait disabled:opacity-70 lg:static lg:h-auto lg:w-auto lg:px-4 lg:py-2">
    @if (randomLoading) {
      <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
    } @else {
      <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
    }
    <span class="hidden lg:inline">{{ randomLoading ? 'Discovering...' : 'Random' }}</span>
  </button>

  @if (randomError) {
    <div role="alert" class="fixed bottom-43 right-4 z-[60] flex max-w-[calc(100vw-2rem)] items-start gap-3 rounded-2xl border border-amber-300 bg-white p-4 text-sm text-slate-800 shadow-xl lg:bottom-auto lg:top-[100px]">
      <i class="fa-solid fa-circle-exclamation mt-0.5 text-amber-600" aria-hidden="true"></i>
      <span>{{ randomError }}</span>
      <button type="button" (click)="clearRandomError()" class="rounded-full p-1 hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600" aria-label="Dismiss error">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
