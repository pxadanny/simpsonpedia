<app-spinner *ngIf="loading && locations.length === 0"></app-spinner>

<section *ngIf="!loading && errorMessage" class="mx-auto max-w-xl px-6 py-7 text-center" role="alert">
  <p class="mb-4 font-semibold text-slate-700">{{ errorMessage }}</p>
  <button (click)="loadLocations(nextUrl ?? undefined)" class="rounded-full bg-amber-400 px-5 py-2.5 font-extrabold text-slate-900 transition hover:bg-amber-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600">
    Try again
  </button>
</section>

<div class="mx-auto grid w-full grid-cols-1 gap-6 p-6 sm:grid-cols-2 md:grid-cols-3 xl:w-5/6 xl:grid-cols-5">
  <a *ngFor="let location of locations; trackBy: trackById"
    [routerLink]="['/locations', location.id]"
    [attr.aria-label]="'View location details: ' + location.name"
    class="group block overflow-hidden rounded-2xl bg-pink-100 shadow-md transition duration-200 hover:-translate-y-1 hover:shadow-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600">

    <div class="relative h-48 overflow-hidden bg-sky-100">
      <ng-container *ngIf="location.image_path && !failedImages.has(location.id); else locationImagePlaceholder">
        <img class="h-full w-full object-contain p-2 transition duration-200 group-hover:scale-105"
          [src]="imageUrl(location.image_path)"
          [alt]="'View of ' + location.name"
          loading="lazy"
          (error)="markImageFailed(location.id)" />
      </ng-container>
      <ng-template #locationImagePlaceholder>
        <div class="flex h-full items-center justify-center text-5xl text-sky-700">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
        </div>
      </ng-template>
      <span *ngIf="location.use" class="absolute left-3 top-3 max-w-[90%] truncate rounded-full bg-slate-900/85 px-3 py-1.5 text-xs font-extrabold text-white">
        {{ location.use }}
      </span>
    </div>

    <div class="p-4">
      <h2 class="text-center text-lg font-extrabold text-slate-900">{{ location.name }}</h2>
      <p class="mt-2 text-center text-sm text-slate-600">
        <i class="fa-solid fa-location-dot mr-1 text-pink-600" aria-hidden="true"></i>
        {{ location.town || 'Town unknown' }}
      </p>
      <p class="mt-3 text-center text-xs font-bold uppercase tracking-wider text-pink-800">
        View details <i class="fa-solid fa-arrow-right ml-1" aria-hidden="true"></i>
      </p>
    </div>
  </a>
</div>

<p *ngIf="!loading && !errorMessage && locations.length === 0" class="mx-auto max-w-xl p-6 text-center text-slate-600">No locations found.</p>

<div *ngIf="isFetching && locations.length > 0" class="py-5 text-center text-sm font-semibold text-slate-500" aria-live="polite">
  Loading more locations...
</div>

<button *ngIf="showScrollTop" (click)="scrollToTop()"
  class="fixed bottom-40 right-5 flex h-14 w-14 items-center justify-center rounded-full bg-yellow-300 text-xl text-slate-900 shadow-lg transition hover:bg-yellow-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 lg:bottom-25 lg:right-10"
  aria-label="Scroll to top">
  <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
</button>
