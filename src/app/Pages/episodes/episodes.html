<app-spinner *ngIf="loading && episodes.length === 0"></app-spinner>

<div class="mx-auto grid w-full grid-cols-1 gap-6 p-6 sm:grid-cols-2 md:grid-cols-3 xl:w-5/6 xl:grid-cols-5">
  <a
    *ngFor="let episode of episodes"
    [routerLink]="['/episodes', episode.id]"
    [attr.aria-label]="'View episode details: ' + episode.name"
    class="group block overflow-hidden rounded-2xl bg-purple-100 shadow-md transition duration-200 hover:-translate-y-1 hover:shadow-xl focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600"
  >
    <div class="relative h-48 overflow-hidden bg-purple-200">
      <img *ngIf="episode.image_path; else episodeImagePlaceholder"
        class="h-full w-full object-cover transition duration-200 group-hover:scale-105"
        [src]="imageUrl(episode.image_path)"
        [alt]="'Scene from ' + episode.name"
        loading="lazy" />
      <ng-template #episodeImagePlaceholder>
        <div class="flex h-full items-center justify-center text-5xl text-purple-600">
          <i class="fa-solid fa-tv" aria-hidden="true"></i>
        </div>
      </ng-template>
      <div class="absolute left-3 top-3 rounded-full bg-slate-900/85 px-3 py-1.5 text-xs font-extrabold text-white">
        Season {{ episode.season }} · #{{ episode.episode_number }}
      </div>
    </div>
    <div class="p-4">
      <h2 class="text-center text-lg font-extrabold text-slate-900">{{ episode.name }}</h2>
      <p class="mt-3 text-center text-xs font-semibold uppercase tracking-wider text-purple-700">
        View details <i class="fa-solid fa-arrow-right ml-1" aria-hidden="true"></i>
      </p>
    </div>
  </a>
</div>

<div *ngIf="loading && episodes.length > 0" class="py-5 text-center text-sm font-semibold text-slate-500" aria-live="polite">
  Loading more episodes...
</div>

<button *ngIf="showScrollTop" (click)="scrollToTop()"
  class="fixed bottom-40 right-5 flex h-14 w-14 items-center justify-center rounded-full bg-yellow-300 text-xl text-slate-900 shadow-lg transition hover:bg-yellow-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-600 lg:bottom-25 lg:right-10"
  aria-label="Scroll to top">
  <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
</button>
