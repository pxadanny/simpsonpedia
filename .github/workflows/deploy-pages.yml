name: Build, test and deploy Simpsonpedia

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test and build Angular
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build for GitHub Pages
        run: npm run build -- --configuration production --base-href=/simpsonpedia/

      - name: Prepare SPA routing fallback
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test -f dist/simpsonpedia/browser/index.html
          cp dist/simpsonpedia/browser/index.html dist/simpsonpedia/browser/404.html
          touch dist/simpsonpedia/browser/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/simpsonpedia/browser

  deploy:
    name: Publish site
    if: github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
